<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04-函数</title>
</head>
<body>

  <!-- ================= 知识点回顾 =================
       对应笔记：../../笔记/03_第三章 JavaScript.md
       不会做时：打开笔记后 Ctrl+F 搜下面的小节标题
   1. 写法1：function 函数名(参数){ 函数体 }
   2. 写法2：var 函数名 = function(参数){ 函数体 }
   3. 特点：无返回值类型、参数无类型、实参形参个数可不一致
  ================================================= -->

  <script>
     /* ==================================================
       TODO 1【两种声明方式】⭐
       对应笔记：3.3 JS函数声明（语法1 / 语法2）
       用两种写法分别写一个求两个数之和的函数：
       1. function sum(a,b){ return a+b; }
       2. var add = function(a,b){ return a+b; }
       分别调用并 console.log 输出结果。
       目标效果：两个函数都能正确求和
    ================================================== */
    function sum(a,b){
      return a+b;
    }
    var add = function(a,b){
      return a+b;
    }
    console.log(sum(1,2));
    console.log(add(1,2));


     /* ==================================================
       TODO 2【实参形参个数不一致】⭐
       对应笔记：3.3 JS函数声明（函数特点）
       写一个函数 test(a, b)，函数体里 console.log(a, b)。
       1. 用 test(1, 2) 调用
       2. 用 test(1) 调用（少传一个参数）
       3. 用 test(1, 2, 3) 调用（多传一个参数）
       目标效果：观察少传时 b 是什么、多传时多出的参数去哪了
    ================================================== */
    function test(a,b){
      console.log(a,b);
    }
    test(1,2);
    test(1);
    test(1,2,3);


  </script>
</body>
</html>
