<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Vue基础6：v-bind属性绑定</title>
</head>
<body>

  <!-- ============================================================
       【知识点：v-bind 属性绑定】
       前面说过：{{ }} 只能放在标签的【文本内容】里，不能放在属性里。
       要在属性里使用数据，就得用 v-bind。

       完整写法：v-bind:src="avatar"
       简写    ：:src="avatar"   （冒号是 v-bind: 的简写）

       作用：把属性（src / href / alt 等）的值，绑定成 data 里的数据。
       ============================================================ -->

  <div id="app">
    <!-- :src 是 v-bind:src 的简写，把 src 绑定成 data 里的 avatar -->
    <img :src="avatar" :alt="name" width="80">
    <p>{{ name }}</p>
  </div>

  <script type="module">
    import { createApp } from './js/vue.esm-browser.js';

    createApp({
      data() {
        return {
          // TODO 1：补全 avatar —— 一张图片的 url 地址
          // （可以用课件里那种 oss 图片地址，或任意网络图片地址）
          avatar: 'https://img2.baidu.com/it/u=3422222222,2822222222&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=500',
          // TODO 2：补全 name —— 图片的描述文字
          // （会显示在 img 的 alt 属性 和 下面的 <p>{{name}}</p> 里）
          name: '张三'
        }
      }
    }).mount('#app');
  </script>

  <!-- TODO 3（思考，不写代码）：
       为什么 <img> 的属性不能写成 src="{{avatar}}"？
       提示：{{ }} 只能放在文本内容里，属性必须用 v-bind / :src
       试试把 :src="avatar" 改成 src="{{avatar}}" 会怎样（会显示错误路径） -->

</body>
</html>
