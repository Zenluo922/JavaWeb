<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习五：事件监听与常见事件</title>
</head>
<body>

  <input type="button" id="btn1" value="点我1">
  <input type="button" id="btn2" value="点我2">
  <br><br>
  <input type="text" id="username" placeholder="输入用户名">
  <input type="text" id="age" placeholder="输入年龄">

  <!-- ================= 知识点回顾 =================
   1. addEventListener('事件名', 回调函数) —— 推荐，可以给同一元素绑定多个同类型事件
   2. onclick = 函数 —— 早期写法，多次绑定会【覆盖】前面的，仅了解
   3. 常见事件：
      click(点击) / mouseenter(移入) / mouseleave(移出)
      keydown(按下) / keyup(抬起) / blur(失去焦点) / focus(获得焦点)
      input(输入时) / submit(表单提交)
  ================================================= -->

  <script>
    /* ==================================================
       TODO 1：用 addEventListener 给 id 为 btn1 的按钮绑定 click 事件，
               点击后在控制台打印 "我被点击了"。
       提示：document.querySelector('#btn1').addEventListener('click', () => { ... })
    ================================================== */
    document.querySelector('#btn1').addEventListener('click', () => {
      console.log('我被点击了');
    });


    /* ==================================================
       TODO 2：再给 btn1 绑定【第二个】click 事件，打印 "又被点击了"。
               点击一次按钮，观察两个事件是否【都】触发？
       思考：如果用 onclick 绑定两次，结果会怎样？
       提示：addEventListener 可以多次绑定不覆盖，onclick 会覆盖
    ================================================== */
    document.querySelector('#btn2').addEventListener('click', () => {
      console.log('又被点击了');
    });


    /* ==================================================
       TODO 3：给 id 为 username 的输入框绑定 keydown 事件（打印 "键盘按下"），
               给 id 为 age 的输入框绑定 blur 事件（打印 "失去焦点"）。
       提示：常见事件名见上方知识点回顾
    ================================================== */
    document.querySelector('#username').addEventListener('keydown', () => {
      console.log('键盘按下');
    });


    document.querySelector('#age').addEventListener('blur', () => {
      console.log('失去焦点');
    });


    /* ==================================================
       TODO 4（思考，不写代码）：
               addEventListener 和 onclick 的核心区别是什么？
               为什么更推荐用 addEventListener？
    ================================================== */



  </script>
</body>
</html>
