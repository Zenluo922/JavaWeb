<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习二：JS函数</title>
</head>
<body>

  <!-- ================= 知识点回顾 =================
   1. 具名函数：function 函数名(参数){...}，调用 函数名(实参)
   2. 匿名函数-函数表达式：let 变量 = function(参数){...}
   3. 箭头函数：let 变量 = (参数) => { ... }
      - 单个参数可省略小括号；函数体只有一行 return 可省略大括号和 return
   4. 参数与返回值 return
  ================================================= -->

  <script>
    /* ==================================================
       TODO 1：定义一个【具名函数】add(a, b)，返回 a + b，
               然后调用它计算 10 + 20 并用 console.log 输出。
       目标效果：控制台打印 30
       提示：function add(a, b) { return a + b; }
    ================================================== */
    function add(a, b) {
      return a + b;
    }
    console.log(add(10, 20));


    /* ==================================================
       TODO 2：用【函数表达式】定义一个匿名函数 mul(a, b)，返回 a * b，
               调用它计算 5 * 6 并输出。
       提示：let mul = function(a, b) { ... }
    ================================================== */
    let mul = function(a, b) {
      return a * b;
    }
    console.log(mul(5, 6));


    /* ==================================================
       TODO 3：用【箭头函数】定义 sub(a, b)，返回 a - b，
               调用它计算 100 - 30 并输出。
       提示：let sub = (a, b) => { ... }
    ================================================== */
    let sub = (a,b)=>{
      return a - b;
    }
    console.log(sub(100, 30));


    /* ==================================================
       TODO 4（思考，不写代码）：
               三种函数写法有什么区别？
               箭头函数和普通函数在 this 指向上有什么不同？
       提示：回想课件 05 里「箭头函数 this 指向父级」的知识点
    ================================================== */



  </script>
</body>
</html>
