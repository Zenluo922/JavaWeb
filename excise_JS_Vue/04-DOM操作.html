<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习四：DOM操作</title>
</head>
<body>

  <h1 id="title">原标题</h1>
  <h1>第二个标题</h1>
  <h1>第三个标题</h1>

  <ul id="list">
    <li>项目一</li>
    <li>项目二</li>
    <li>项目三</li>
    <li>项目四</li>
  </ul>

  <!-- ================= 知识点回顾 =================
   1. querySelector('选择器')     => 获取【第一个】匹配的元素（单个）
   2. querySelectorAll('选择器')  => 获取【所有】匹配的元素（返回 NodeList，可遍历）
   3. 修改文本内容：元素.innerHTML = '新内容'
   4. 修改样式：元素.style.backgroundColor = '#xxx'
  ================================================= -->

  <script>
    /* ==================================================
       TODO 1：用 document.querySelector 获取 id 为 title 的 h1，
               把它的文本内容改成 "修改后的标题"。
       提示：document.querySelector('#title').innerHTML = '...'
    ================================================== */
    document.querySelector('#title').innerHTML = '修改后的标题';


    /* ==================================================
       TODO 2：用 document.querySelectorAll 获取【所有】h1，
               用 for 循环遍历，把每个 h1 的文字都改成 "统一标题"。
       提示：querySelectorAll('h1') 返回的是集合，用下标访问 hs[i]
    ================================================== */
    let hs = document.querySelectorAll('h1');
    for(let i=0;i<hs.length;i++){
      hs[i].innerHTML = '统一标题';
    }

    /* ==================================================
       TODO 3：获取 id 为 list 下的所有 li，实现【隔行换色】：
               - 偶数行（下标 0、2...）背景色 #f2e2e2
               - 奇数行（下标 1、3...）背景色 #e6f7ff
       提示：用 for 循环 + 判断下标奇偶，li[i].style.backgroundColor = '...'
    ================================================== */
    let lis = document.querySelectorAll('li');
    for(let i=0;i<lis.length;i++){
      if(i%2==0){
        lis[i].style.backgroundColor = '#f2e2e2';
      }else{
        lis[i].style.backgroundColor = '#e6f7ff';
      }
    }


    /* ==================================================
       TODO 4（思考，不写代码）：
               querySelector 和 querySelectorAll 的返回值有什么不同？
               什么时候用哪一个？
    ================================================== */



  </script>
</body>
</html>
