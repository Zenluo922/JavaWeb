<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>02-文本与列表标签</title>
</head>
<body>

  <!-- ================= 知识点回顾 =================
       对应笔记：../../笔记/02_第二章 HTML&CSS.md
       不会做时：打开笔记后 Ctrl+F 搜下面的小节标题
   1. 标题：h1~h6（一级最大）
   2. 段落：p（自动分段）；换行：br；分隔线：hr
   3. 列表：无序 ul>li，有序 ol>li，可嵌套
  ================================================= -->

  <!-- TODO 1【标题 / 段落 / 换行】
       对应笔记：2.1 标题标签 / 2.2 段落标签 / 2.3 换行标签
       用 HTML 写出：
       1. 一个一级标题"今日新闻"
       2. 一个段落（随便一句话）
       3. 段落内一句话中间换行（用 br）
       4. 一条分隔线（用 hr）
       目标效果：标题在最上，下面是段落（中间有换行），再下面一条横线 -->
<h1>晨间新闻</h1>
<p>这是一个段落，<br>里面包含了一句话。</p>
<hr>



  <!-- TODO 2【列表】
       对应笔记：2.4 列表标签
       用 HTML 写出：
       1. 一个无序列表：苹果 / 牛奶 / 面包
       2. 一个有序列表：第一步 / 第二步 / 第三步
       3. 一个嵌套列表：外层有序列表，第一项"前端"里再套一个无序列表（HTML/CSS/JS）
       目标效果：前两个列表项带圆点/数字，第三个有缩进的子项 -->
<ul>
     <li>苹果</li>
     <li>牛奶</li>
     <li>面包</li>  
</ul>
<ol>
     <li>第1步</li>
     <li>第2步</li>
     <li>第3步</li>
</ol>
<ol>
     <li>前端
       <ul>
          <li>HTML</li>
          <li>CSS</li>
          <li>JS</li>
       </ul>
     </li>
</ol>



</body>
</html>
