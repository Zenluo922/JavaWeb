<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>04-表格</title>
</head>
<body>

  <!-- ================= 知识点回顾 =================
       对应笔记：../../笔记/02_第二章 HTML&CSS.md
       不会做时：打开笔记后 Ctrl+F 搜下面的小节标题
   1. table(表格) tr(一行) td(单元格) th(表头,加粗居中)
   2. 跨行 rowspan / 跨列 colspan（加在 td 上）
  ================================================= -->

  <!-- TODO 1【基础表格】⭐
       对应笔记：2.7 表格标签（常规表格）
       做一个"学生成绩表"，3 行 3 列：
       表头(th)：姓名 / 语文 / 数学
       数据：张三 90 85；李四 88 92
       给 table 加 border="1" 让边框显示
       目标效果：带边框的 3×3 表格，表头加粗居中 -->
<table border="1">
     <tr>
          <th>姓名</th>
          <th>语文</th>
          <th>数学</th>
     </tr>
     <tr>
       <td>张三</td>
       <td>90</td>
       <td>85</td>
     </tr>
     <tr>
       <td>李四</td>
       <td>88</td>
       <td>92</td>
     </tr>
   </table>


  <!-- TODO 2【跨行跨列】⭐
       对应笔记：2.7 表格标签（rowspan / colspan）
       在上面的表格基础上，扩展成：
       1. 左边加一列"科目"跨两行合并（语文/数学各占一行）
       2. 底部加一行"平均分"跨 3 列合并，居中显示"平均分：89"
       目标效果：左边一个竖着合并的"科目"单元格，底部一行横跨整表
       提示：rowspan 竖着合并、colspan 横着合并，被合并的格子要删掉 -->
<table border="1">
  <tr>
    <!-- 新增：科目，向下跨2行（对应张三、李四两行） -->
    <td rowspan="3">科目</td>
    <th>姓名</th>
    <th>语文</th>
    <th>数学</th>
  </tr>
  <tr>
    <!-- ⚠️ 这里不要写科目td，已经被上面rowspan合并了！ -->
    <td>张三</td>
    <td>90</td>
    <td>85</td>
  </tr>
  <tr>
    <!-- ⚠️ 这里不要写科目td，已经被上面rowspan合并了！ -->
    <td>李四</td>
    <td>88</td>
    <td>92</td>
  </tr>
  <tr>
    <!-- 跨4列合并！！现在一行总共有4个单元格，colspan="4"，居中 -->
    <td colspan="4" align="center">平均分：89</td>
  </tr>
</table>
</body>
</html>
