       写三个超链接：
       1. 跳到百度（外链，新窗口打开）http://www.baidu.com
       2. 跳到本地文件 01-HTML基础结构与语法规则.html（相对路径，当前窗口）

       <p><a href="01-HTML基础结构与语法规则.html" target="_self"><b>跳我2</b></a></p>
       <p><a href="http://www.baidu.com" target="_self"><b>跳我3</b></a></p>
