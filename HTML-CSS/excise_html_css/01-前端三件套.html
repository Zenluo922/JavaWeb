<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>01-前端三件套练习</title>
</head>
<body>

  <!-- ============================================================
       知识点：前端三件套
       HTML(结构) = 页面有什么
       CSS(表现)  = 长什么样
       JS(行为)   = 能干嘛
       目标：亲手写出三件套，分清各自职责
       ============================================================ -->

  <!-- TODO 1【结构 + 表现】
       1. 写一个一级标题 <h1> 和一段文字 <p>，内容随便写
       2. 给那个 <h1> 加上内联样式，让文字变成红色
       目标效果：标题是红色，p 那段文字还是默认的黑色、靠左 -->
  <!-- 提示：HTML 负责"有什么"（h1/p），style 属性就是 CSS，负责"长什么样" -->



  <!-- TODO 2【行为 JS】
       写一个 <button>，点击它之后，把某个标签的文字改掉。
       目标效果：点按钮前是一句文字，点按钮后变成另一句文字 -->
  <!-- 提示：三个关键词——onclick（写在 button 上）、getElementById（按 id 找人）、innerText（改文字）。
       思考：CSS 能让文字"点一下就变"吗？为什么不能？这能说明 JS 为什么是"行为"。 -->

</body>
</html>
