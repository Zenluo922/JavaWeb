<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>03-标签特点练习</title>
</head>
<body>

  <!-- ============================================================
       知识点：标签特点
       1. 标签不区分大小写，建议小写
       2. 属性值单双引号都行，一般写双引号
       3. 标签是预定义好的，只有 h1~h6，没有 h7
       ============================================================ -->

  <!-- TODO 1【大小写 + 引号】
       1. 写一个大写的 <H1> 和一个小写的 <h1>，文字不同
       2. 写两个超链接 <a>，一个用单引号包 href，一个用双引号
       目标效果：两个标题一样大；两个链接都能点 -->
  <!-- 提示：标签不区分大小写、单双引号都行。但项目里统一写小写 + 双引号 -->
   <h1>这是一个标题</h1>
   <H1>这是一个标题</H1>
   <a href="https://www.baidu.com" target="_blank">百度一下</a>
   <a href='https://www.baidu.com' target='_blank'>百度一下</a>


  <!-- TODO 2【没有 h7】
       写一个 <h7> 标签，随便写点文字。
       目标效果：它看起来就是普通文字，没有标题的加粗变大效果 -->
  <!-- 提示：浏览器不认识 h7，会把它当普通文本处理。
       思考：这说明标签是"预先规定死的"。你发明一个不存在的标签名会发生什么？ -->

</body>
</html>
